# DOSBox-X config for VMODEM automated testing
# Minimal setup: NE2000 + slirp, no dosenv needed

[log]
logfile=/dev/null

[dosbox]
memsize=16

[cpu]
cputype=486
cycles=25000

[ne2000]
ne2000=true
nicbase=300
nicirq=3
macaddr=AC:DE:48:00:00:01
backend=slirp

[ethernet, slirp]
tcp_port_forwards = 2323

[serial]
serial1=dummy

[autoexec]
