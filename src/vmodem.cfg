/*
 * vmodem.cfg - mTCP compile-time configuration for VMODEM TSR
 *
 * Include the mTCP global defaults first, then override what we need.
 * Reduced buffer counts to keep the 16-bit DGROUP under 64 KB.
 */

#ifndef VMODEM_CFG_H
#define VMODEM_CFG_H

#define MTCP_PROGRAM_NAME "vmodem"

/* ---- Pull in the mTCP global defaults ---- */
#include "global.cfg"

/* ---- Feature selection ---- */
#define COMPILE_ARP
#define IP_FRAGMENTS_ON
#define COMPILE_UDP
#define COMPILE_TCP
#define COMPILE_DNS
#define COMPILE_ICMP
#define TCP_LISTEN_CODE       /* needed: TcpSocket::listen() */
#define NOTRACE               /* disable mTCP tracing — saves code/data in TSR */

/* ---- Overrides: reduce buffer sizes to stay within 64KB DGROUP ---- */

/* Packet layer: 4 buffers instead of 10 */
#undef  PACKET_BUFFERS
#define PACKET_BUFFERS       (4)

/* TCP: 4 COM ports × 2 sockets (data + listen) = 8 sockets max */
#undef  TCP_MAX_SOCKETS
#define TCP_MAX_SOCKETS      (8)

/* Reduce transmit buffers to save ~4 KB */
#undef  TCP_MAX_XMIT_BUFS
#define TCP_MAX_XMIT_BUFS    (6)

/* DNS: minimal cache */
#undef  DNS_MAX_ENTRIES
#define DNS_MAX_ENTRIES      (1)

#endif /* VMODEM_CFG_H */
