/*
 * vmodem.cfg - mTCP compile-time configuration for VMODEM TSR
 *
 * Include the mTCP global defaults first, then override what we need.
 * Reduced buffer counts to keep the 16-bit DGROUP under 64 KB.
 *
 * Heap budget (near heap in 64KB DGROUP):
 *   DGROUP static/BSS/stack: ~41 KB  →  free heap ~24 KB
 *   Packet buffers:  6 × 1514       =  9,084
 *   IP frag:         1 × 2082       =  2,082
 *   TCP sockets:     8 × ~210       =  1,680
 *   TCP xmit bufs:   4 × ~612       =  2,448
 *   TCP recv bufs:   runtime malloc  ≤  2,049 per accept
 *                                    -------
 *   Total est:                       ~17,343  (leaves ~6.5 KB headroom)
 */

#ifndef VMODEM_CFG_H
#define VMODEM_CFG_H

#define MTCP_PROGRAM_NAME "vmodem"

/* ---- Pull in the mTCP global defaults ---- */
#include "global.cfg"

/* ---- Feature selection ---- */
#define COMPILE_ARP
#define IP_FRAGMENTS_ON
#define COMPILE_UDP
#define COMPILE_TCP
#define COMPILE_DNS
#define COMPILE_ICMP
#define TCP_LISTEN_CODE       /* needed: TcpSocket::listen() */
#define NOTRACE               /* disable mTCP tracing — saves code/data in TSR */

/* ---- Overrides: reduce buffer sizes to stay within 64KB DGROUP ---- */

/* Packet layer: 8 buffers.  Each is 1514 bytes; 8 × 1514 = ~12 KB.
 * Needs 8 on real hardware — fewer causes SYN drops and crashes. */
#undef  PACKET_BUFFERS
#define PACKET_BUFFERS       (8)

/* TCP: 4 COM ports × 2 sockets (data + listen) = 8 */
#undef  TCP_MAX_SOCKETS
#define TCP_MAX_SOCKETS      (8)

/* Transmit buffers: 4 (each ~612 bytes with MSS 536).
 * Enough for telnet BBS; reduced from 6 to save ~1.2 KB. */
#undef  TCP_MAX_XMIT_BUFS
#define TCP_MAX_XMIT_BUFS    (4)

/* IP fragment reassembly: 1 concurrent (default 4).
 * Each BigPacket_t is ~2082 bytes.  1 slot is enough for
 * occasional fragmented packets on remote connections. */
#undef  IP_MAX_FRAG_PACKETS
#define IP_MAX_FRAG_PACKETS  (1)

/* DNS: minimal cache */
#undef  DNS_MAX_ENTRIES
#define DNS_MAX_ENTRIES      (1)

#endif /* VMODEM_CFG_H */
